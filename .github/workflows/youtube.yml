name: YouTube Upload

on:
  workflow_dispatch:

  schedule:
    - cron: '0 */12 * * *'

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: cd youtube-automation && pip install -r requirements.txt

      - name: Restore Auth Files
        run: |
          cd youtube-automation

          mkdir -p auth

          echo "${{ secrets.SERVICE_ACCOUNT_JSON }}" | base64 -d > auth/service_account.json

          echo "${{ secrets.YOUTUBE_TOKEN }}" | base64 -d > auth/token.pickle

      - name: Run Upload Script
        run: cd youtube-automation && python main.py

      - name: Commit Updated JSON
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          git add videos_master.json

          git commit -m "Update uploaded video status" || echo "No changes"

          git push
